---
# Checkmk Appliance: install the Checkmk version of the CMK Server Settings
# from its CMA package and update the existing site. Needs root over SSH and
# a standalone appliance, see the documentation of the Syncer.

- hosts: all
  # Temp files on the server in /tmp, not in the home of the login user,
  # also when the playbook runs on the command line (file integrity checks
  # like AIDE watch the home)
  vars:
    ansible_remote_tmp: /tmp

  roles:
    - cmk_appliance_mngmt
