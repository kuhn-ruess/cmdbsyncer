---
cmk_install_agent: False
cmk_register_tls: False
cmk_register_bakery: False
cmk_create_host: False
cmk_create_folder: /inbox
cmk_register_central_bakery: False
cmk_delete_manual_files: False
cmk_discover: False
cmk_linux_tmp: /tmp
cmk_windows_tmp: c:\temp
cmk_agent_receiver_port: 8000
cmk_server_port: 443
cmk_server_ip: False
cmk_main_server_ip: False
cmk_agent_port: 6556
cmk_agent_configure_firewall_zone: public
configure_firewall: False
validate_certs: True
# Host name the role reports to Checkmk (agent download, registration,
# host creation, discovery). Override it per host with an Ansible custom
# variable when the Checkmk host name differs from the inventory name,
# e.g. short name in Checkmk while ansible_host holds the FQDN.
cmk_agent_host_name: "{{ inventory_hostname }}"
