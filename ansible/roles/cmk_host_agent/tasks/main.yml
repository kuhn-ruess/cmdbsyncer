---
- name: "Create Host in CheckMK"
  ansible.builtin.uri:
    url: "https://{{ cmk_main_server }}/{{ cmk_main_site }}/check_mk/api/1.0/domain-types/host_config/collections/all"
    method: POST
    validate_certs: "{{ validate_certs | bool }}"
    url_username: "{{ cmk_user }}"
    url_password: "{{ cmk_secret }}"
    force_basic_auth: true
    headers:
      Accept: "application/json"
      Content-Type: "application/json"
    body_format: json
    body:
      host_name: "{{ cmk_agent_host_name }}"
      folder: "{{ cmk_create_folder | default('/') }}"
    status_code: [200, 201, 409]
  no_log: true
  when: cmk_create_host | bool
  delegate_to: localhost
  ignore_errors: yes
  register: cmk_create_host_result

- name: "Report the error"
  ansible.builtin.include_tasks: report_error.yml
  vars:
    cmk_step: "Create Host in Checkmk"
    cmk_result: "{{ cmk_create_host_result }}"
  when: cmk_create_host_result is failed

- ansible.builtin.include_tasks: "{{ ansible_os_family }}-tasks.yml"

- name: "Discover Services"
  ansible.builtin.uri:
    url: "https://{{ cmk_main_server }}/{{ cmk_main_site }}/check_mk/api/1.0/domain-types/service_discovery_run/actions/start/invoke"
    method: POST
    validate_certs: "{{ validate_certs | bool }}"
    url_username: "{{ cmk_user }}"
    url_password: "{{ cmk_secret }}"
    force_basic_auth: true
    headers:
      Accept: "application/json"
    return_content: false
    body:
      host_name: "{{ cmk_agent_host_name }}"
      mode: "fix_all"
    body_format: json
  no_log: true
  when: cmk_discover | bool
  ignore_errors: yes
  delegate_to: localhost
  register: cmk_discover_result

- name: "Report the error"
  ansible.builtin.include_tasks: report_error.yml
  vars:
    cmk_step: "Discover Services"
    cmk_result: "{{ cmk_discover_result }}"
  when: cmk_discover_result is failed
