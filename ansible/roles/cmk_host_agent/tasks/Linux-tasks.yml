---
# The commands run without a shell and get every value as its own
# argument, so a secret with spaces, quotes, $ or backslashes reaches
# the agent unchanged.
- name: "Register Agent for TLS."
  become: true
  ansible.builtin.command:
    argv:
      - cmk-agent-ctl
      - register
      - -H
      - "{{ cmk_agent_host_name }}"
      - -s
      - "{{ cmk_server_ip if cmk_server_ip else cmk_server }}:{{ cmk_agent_receiver_port }}"
      - -i
      - "{{ cmk_site }}"
      - -U
      - "{{ cmk_user }}"
      - --password
      - "{{ cmk_secret }}"
      - --trust-cert
  no_log: true
  when: cmk_register_tls | bool
  ignore_errors: yes

- name: "Register Agent on Local Bakery."
  become: true
  ansible.builtin.command:
    argv:
      - cmk-update-agent
      - register
      - -H
      - "{{ cmk_agent_host_name }}"
      - -s
      - "{{ cmk_server_ip if cmk_server_ip else cmk_server }}:{{ cmk_server_port }}"
      - -i
      - "{{ cmk_site }}"
      - -p
      - https
      - -U
      - "{{ cmk_user }}"
      - --password
      - "{{ cmk_secret }}"
  no_log: true
  when: cmk_register_bakery | bool
  ignore_errors: yes

- name: "Register Agent on Central Bakery."
  become: true
  ansible.builtin.command:
    argv:
      - cmk-update-agent
      - register
      - -H
      - "{{ cmk_agent_host_name }}"
      - -s
      - "{{ cmk_main_server_ip if cmk_main_server_ip else cmk_main_server }}:{{ cmk_server_port }}"
      - -i
      - "{{ cmk_main_site }}"
      - -p
      - https
      - -U
      - "{{ cmk_user }}"
      - --password
      - "{{ cmk_secret }}"
  no_log: true
  when: cmk_register_central_bakery | bool
  ignore_errors: yes

- name: "Cleanup cache"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/check_mk_agent/cache/plugins_3600/cmk-update-agent.cache
    - /var/lib/check_mk_agent/cache/plugins_cmk-update-agent.cache
  when: cmk_register_central_bakery or cmk_register_bakery
  ignore_errors: yes
