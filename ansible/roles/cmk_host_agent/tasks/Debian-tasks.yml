---

- name: "Download Checkmk Agent."
  ansible.builtin.uri:
    url: "https://{{ cmk_server }}:{{ cmk_server_port }}/{{ cmk_site }}/check_mk/api/1.0/domain-types/agent/actions/download_by_host/invoke?os_type=linux_deb&host_name={{ cmk_agent_host_name }}"
    dest: "{{ cmk_linux_tmp }}/cmk_agent.deb"
    method: GET
    validate_certs: "{{ validate_certs | bool }}"
    url_username: "{{ cmk_user }}"
    url_password: "{{ cmk_secret }}"
    force_basic_auth: true
    headers:
      Accept: "application/octet-stream"
  no_log: true
  when: cmk_install_agent | bool
  register: checkmk_agent_download_state
  until: checkmk_agent_download_state is not failed
  retries: 3
  delay: 10
  ignore_errors: yes

- name: "Report the error"
  ansible.builtin.include_tasks: report_error.yml
  vars:
    cmk_step: "Download Checkmk Agent"
    cmk_result: "{{ checkmk_agent_download_state }}"
  when: checkmk_agent_download_state is failed

- name: "Install Checkmk Agent"
  become: true
  ansible.builtin.apt:
    deb: "{{ cmk_linux_tmp }}/cmk_agent.deb"
    state: present
  when: (cmk_install_agent | bool) and checkmk_agent_download_state.status == 200

# Only with an active ufw, as in the Checkmk Ansible collection. With
# cmk_server_ip only the Checkmk server may connect, else the port is open.
- name: "Check if ufw is active"
  become: true
  ansible.builtin.command:
    argv: [ufw, status]
  register: cmk_ufw_state
  changed_when: false
  failed_when: false
  when: configure_firewall | bool

- name: "Set Firewall to allow Access to {{ cmk_agent_port }}"
  become: true
  community.general.ufw:
    rule: allow
    port: "{{ cmk_agent_port | string }}"
    proto: tcp
    from_ip: "{{ cmk_server_ip if cmk_server_ip else 'any' }}"
  when:
    - configure_firewall | bool
    - "'Status: active' in (cmk_ufw_state.stdout | default(''))"

- ansible.builtin.include_tasks: "Linux-tasks.yml"
