---
- name: "Cleanup files"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/bin/check_mk_agent
    - /usr/bin/check_mk_agent_cache
    - /usr/bin/cmk-update-agent
    - /usr/lib/check_mk_agent/
    - /var/lib/check_mk_agent/
  when: cmk_delete_manual_files | bool

- name: "Download Checkmk Agent."
  ansible.builtin.uri:
    url: "https://{{ cmk_server }}:{{ cmk_server_port }}/{{ cmk_site }}/check_mk/api/1.0/domain-types/agent/actions/download_by_host/invoke?os_type=linux_rpm&host_name={{ cmk_agent_host_name }}"
    dest: "{{ cmk_linux_tmp }}/cmk_agent.rpm"
    method: GET
    validate_certs: "{{ validate_certs | bool }}"
    url_username: "{{ cmk_user }}"
    url_password: "{{ cmk_secret }}"
    force_basic_auth: true
    headers:
      Accept: "application/octet-stream"
  no_log: true
  when: cmk_install_agent | bool
  register: checkmk_agent_download_state
  until: checkmk_agent_download_state is not failed
  retries: 3
  delay: 10
  ignore_errors: yes

- name: "Report the error"
  ansible.builtin.include_tasks: report_error.yml
  vars:
    cmk_step: "Download Checkmk Agent"
    cmk_result: "{{ checkmk_agent_download_state }}"
  when: checkmk_agent_download_state is failed

# The dnf command, not the dnf module: the module has to run with the Python
# of the system's dnf bindings, which is 3.6 on RHEL 8 and too old for the
# Ansible of the Syncer on the targets ("future feature annotations").
- name: "Install Checkmk Agent"
  become: true
  ansible.builtin.command:
    argv: [dnf, install, -y, --nogpgcheck, "{{ cmk_linux_tmp }}/cmk_agent.rpm"]
  when: (cmk_install_agent | bool) and checkmk_agent_download_state.status == 200

# Only with a running firewalld, as in the Checkmk Ansible collection. With
# cmk_server_ip only the Checkmk server may connect, else the port is open.
- name: "Check if firewalld runs"
  ansible.builtin.command:
    argv: [systemctl, is-active, firewalld]
  register: cmk_firewalld_state
  changed_when: false
  failed_when: false
  when: configure_firewall | bool

- name: "Set Firewall to allow Access to {{ cmk_agent_port }}"
  when:
    - configure_firewall | bool
    - (cmk_firewalld_state.stdout | default('') | trim) == 'active'
  ansible.posix.firewalld:
    permanent: true
    immediate: true
    state: enabled
    rich_rule: "{{ ('rule family=\"ipv4\" source address=\"' ~ cmk_server_ip ~ '\" port port=\"' ~ cmk_agent_port ~ '\" protocol=\"tcp\" accept') if cmk_server_ip else omit }}"
    port: "{{ omit if cmk_server_ip else (cmk_agent_port ~ '/tcp') }}"
    zone: "{{ cmk_agent_configure_firewall_zone | default('public') }}"
  become: true

- ansible.builtin.include_tasks: "Linux-tasks.yml"
