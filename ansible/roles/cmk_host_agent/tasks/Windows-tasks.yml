---
# Install Check_MK Agent on Windows
- name: "Download Checkmk Agent."
  ansible.windows.win_get_url:
    url: "https://{{ cmk_server }}:{{ cmk_server_port }}/{{ cmk_site }}/check_mk/api/1.0/domain-types/agent/actions/download_by_host/invoke?os_type=windows_msi&host_name={{ cmk_agent_host_name }}"
    dest: "{{ cmk_windows_tmp }}\\cmk_agent.msi"
    headers:
      # Built here instead of url_password: win_get_url encodes Basic auth
      # as ASCII, b64encode uses UTF-8 like Checkmk expects.
      Authorization: "Basic {{ (cmk_user ~ ':' ~ cmk_secret) | b64encode }}"
      accept: "application/octet-stream"
  no_log: true
  when: cmk_install_agent | bool
  register: cmk_agent_download_result
  until: cmk_agent_download_result is not failed
  retries: 3
  delay: 10
  ignore_errors: yes

- name: "Report the error"
  ansible.builtin.include_tasks: report_error.yml
  vars:
    cmk_step: "Download Checkmk Agent"
    cmk_result: "{{ cmk_agent_download_result }}"
    cmk_error_fatal: true
  when: cmk_agent_download_result is failed

- name: "Install Checkmk Agent"
  ansible.windows.win_package:
    path: "{{ cmk_windows_tmp }}\\cmk_agent.msi"
    arguments: /qn
    state: present
  when: cmk_install_agent | bool

# A registered agent is not registered again, as in the Checkmk Ansible
# collection: cmk-agent-ctl keeps its connections as "server/site", the
# updater writes server, site and its last error into its state file.
- name: "Read the registrations of the agent"
  ansible.windows.win_command: powershell.exe -
  args:
    stdin: Get-Content -ErrorAction Ignore -LiteralPath C:\ProgramData\checkmk\agent\registered_connections.json ; Exit 0
  register: cmk_tls_connections
  changed_when: false
  failed_when: false
  when: cmk_register_tls | bool

- name: "Read the state of the agent updater"
  ansible.windows.win_command: powershell.exe -
  args:
    stdin: Get-Content -ErrorAction Ignore -LiteralPath C:\ProgramData\checkmk\agent\config\cmk-update-agent.state ; Exit 0
  register: cmk_updater_state
  changed_when: false
  failed_when: false
  when: (cmk_register_bakery | bool) or (cmk_register_central_bakery | bool)

# win_command passes argv without PowerShell, every value is escaped as
# one argument.
- name: "Register Agent for TLS."
  ansible.windows.win_command:
    argv:
      - C:\Program Files (x86)\checkmk\service\cmk-agent-ctl.exe
      - register
      - --hostname
      - "{{ cmk_agent_host_name }}"
      - --server
      - "{{ cmk_server }}:{{ cmk_agent_receiver_port }}"
      - --site
      - "{{ cmk_site }}"
      - --user
      - "{{ cmk_user }}"
      - --password
      - "{{ cmk_secret }}"
      - --trust-cert
    chdir: C:\Program Files (x86)\checkmk\service
  no_log: true
  when:
    - cmk_register_tls | bool
    - ('"' ~ cmk_server ~ '/' ~ cmk_site ~ '"') not in (cmk_tls_connections.stdout | default(''))
  changed_when: "'Registration complete' in cmk_register_tls_result.stdout | default('')"
  register: cmk_register_tls_result
  ignore_errors: yes

- name: "Report the error"
  ansible.builtin.include_tasks: report_error.yml
  vars:
    cmk_step: "Register Agent for TLS"
    cmk_result: "{{ cmk_register_tls_result }}"
    cmk_error_fatal: true
  when: cmk_register_tls_result is failed

# check_mk_agent.exe joins the updater arguments with plain spaces into a
# new command line. User and secret are therefore handed over already
# quoted by the Windows argument rules, so they survive that join.
- name: "Register Agent on Local Bakery."
  ansible.windows.win_command:
    argv:
      - C:\Program Files (x86)\checkmk\service\check_mk_agent.exe
      - updater
      - register
      - -s
      - "{{ cmk_server }}:{{ cmk_server_port }}"
      - -i
      - "{{ cmk_site }}"
      - -H
      - "{{ cmk_agent_host_name }}"
      - -p
      - https
      - -U
      - "{{ cmk_updater_user }}"
      - -S
      - "{{ cmk_updater_secret }}"
      - -v
    chdir: C:\Program Files (x86)\checkmk\service
  vars: &cmk_updater_vars
    cmk_updater_user: >-
      {{ '"' ~ (cmk_user | regex_replace('(\\*)"', '\1\1\\"')
                         | regex_replace('(\\+)$', '\1\1')) ~ '"' }}
    cmk_updater_secret: >-
      {{ '"' ~ (cmk_secret | regex_replace('(\\*)"', '\1\1\\"')
                           | regex_replace('(\\+)$', '\1\1')) ~ '"' }}
  no_log: true
  when:
    - cmk_register_bakery | bool
    - >-
      not ((("'server': '" ~ cmk_server ~ "', 'site': '" ~ cmk_site ~ "'") in (cmk_updater_state.stdout | default(''))
      or ("'server': '" ~ cmk_server ~ ":" ~ cmk_server_port ~ "', 'site': '" ~ cmk_site ~ "'") in (cmk_updater_state.stdout | default('')))
      and "'last_error': None" in (cmk_updater_state.stdout | default('')))
  changed_when: "'Successfully registered agent of host' in cmk_register_bakery_result.stderr | default('')"
  register: cmk_register_bakery_result
  ignore_errors: yes

- name: "Report the error"
  ansible.builtin.include_tasks: report_error.yml
  vars:
    cmk_step: "Register Agent on Local Bakery"
    cmk_result: "{{ cmk_register_bakery_result }}"
    cmk_error_fatal: true
  when: cmk_register_bakery_result is failed

- name: "Register Agent on Central Bakery."
  ansible.windows.win_command:
    argv:
      - C:\Program Files (x86)\checkmk\service\check_mk_agent.exe
      - updater
      - register
      - -s
      - "{{ cmk_main_server }}:{{ cmk_server_port }}"
      - -i
      - "{{ cmk_main_site }}"
      - -H
      - "{{ cmk_agent_host_name }}"
      - -p
      - https
      - -U
      - "{{ cmk_updater_user }}"
      - -S
      - "{{ cmk_updater_secret }}"
      - -v
    chdir: C:\Program Files (x86)\checkmk\service
  vars: *cmk_updater_vars
  no_log: true
  when:
    - cmk_register_central_bakery | bool
    - >-
      not ((("'server': '" ~ cmk_main_server ~ "', 'site': '" ~ cmk_main_site ~ "'") in (cmk_updater_state.stdout | default(''))
      or ("'server': '" ~ cmk_main_server ~ ":" ~ cmk_server_port ~ "', 'site': '" ~ cmk_main_site ~ "'") in (cmk_updater_state.stdout | default('')))
      and "'last_error': None" in (cmk_updater_state.stdout | default('')))
  changed_when: "'Successfully registered agent of host' in cmk_register_central_bakery_result.stderr | default('')"
  register: cmk_register_central_bakery_result
  ignore_errors: yes

- name: "Report the error"
  ansible.builtin.include_tasks: report_error.yml
  vars:
    cmk_step: "Register Agent on Central Bakery"
    cmk_result: "{{ cmk_register_central_bakery_result }}"
    cmk_error_fatal: true
  when: cmk_register_central_bakery_result is failed
