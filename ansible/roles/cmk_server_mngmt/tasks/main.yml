
# The installer is staged on the controller in `installation_staging_path`
# (from the Checkmk Settings, served via the inventory), falling back to
# /tmp when it is unset. Set the path to something other than /tmp whenever
# the executing user can't reliably use /tmp — e.g. permission problems or
# private-tmp isolation, where a /tmp staged file is not visible to the
# copy step. The install target below stays /tmp on the remote host.
- name: "Determine the local staging directory for the installer"
  ansible.builtin.set_fact:
    cmk_local_staging: "{{ installation_staging_path | default('/tmp', true) }}"

- name: "Ensure the local staging directory exists"
  ansible.builtin.file:
    path: "{{ cmk_local_staging }}"
    state: directory
  delegate_to: localhost

- name: "Check if we have the Installation File local"
  ansible.builtin.stat:
    path: "{{ cmk_local_staging }}/{{ cmk_version_filename }}"
  register: installation_file
  delegate_to: localhost

- name: "Download Installation File from Checkmk Server"
  ansible.builtin.uri:
    url: "https://download.checkmk.com/checkmk/{{ cmk_version }}/{{ cmk_version_filename}}"
    dest: "{{ cmk_local_staging }}/{{ cmk_version_filename }}"
    method: GET
    user: "{{ subscription_username }}"
    password: "{{ subscription_password }}"
    force_basic_auth: True
  when: not installation_file.stat.exists
  delegate_to: localhost

# Exact match on version and edition: a grep for the version alone also
# hit 2.5.0p19 for 2.5.0p1 or gave two lines for two editions, and then
# installed again on every run.
- name: "Check if Version is already installed on the Servers"
  ansible.builtin.command:
    argv: [omd, versions, --bare]
  register: checkmk_version_installed
  changed_when: false
  failed_when: false

- name: "Remember if the Version is installed"
  ansible.builtin.set_fact:
    cmk_version_missing: "{{ (cmk_version ~ '.' ~ cmk_edition) not in (checkmk_version_installed.stdout_lines | default([])) }}"

- name: "Copy Installation File to Servers"
  ansible.builtin.copy:
    src: "{{ cmk_local_staging }}/{{ cmk_version_filename }}"
    dest: "/tmp/{{ cmk_version_filename }}"
  when: cmk_version_missing | bool

- ansible.builtin.include_tasks: "{{ ansible_os_family }}-tasks.yml"


- name: "Check Site versions"
  become: True
  ansible.builtin.shell: |
    set -o pipefail
    omd version {{ cmk_site }} | egrep -o '[^ ]+$'
  args:
    executable: /bin/bash
  changed_when: server_site_version.stdout != cmk_version+"."+cmk_edition
  register: server_site_version
  ignore_errors: True

# Checked by the site directory, the "no such site" message of omd differs
# between Checkmk versions
- name: "Check if the Site exists"
  become: True
  ansible.builtin.stat:
    path: "/omd/sites/{{ cmk_site }}"
  register: site_dir

- name: "Create needed Sites on Servers"
  become: True
  ansible.builtin.shell: |
    set -e
    omd -V {{ cmk_version }}.{{ cmk_edition }} create {{ ('--admin-password ' ~ (inital_password | quote)) if inital_password else '' }} {{ cmk_site }}
    omd start {{ cmk_site }}
  args:
    executable: /bin/bash
  when: not site_dir.stat.exists
  register: site_just_installed

- name: "Calculation downtime start"
  command: "date +'%Y-%m-%dT%H:%M:%S%:z'"
  register: checkmk_downtime_start
  delegate_to: localhost

- name: "Calculation downtime end +{{ cmk_downtime_range }} hours"
  command: "date +'%Y-%m-%dT%H:%M:%S%:z' --date '+{{ cmk_downtime_range }} hours'"
  register: checkmk_downtime_end
  delegate_to: localhost

- name: "Set host to downtime before site update"
  ansible.builtin.uri:
    url: "{{ cmk_main_server_full }}/check_mk/api/1.0/domain-types/downtime/collections/host"
    method: POST
    validate_certs: no
    url_username: "{{ cmk_user }}"
    url_password: "{{ cmk_secret }}"
    force_basic_auth: true
    headers:
      Accept: "application/json"
      Content-Type: "application/json"
    body_format: json
    body:
      start_time: "{{ checkmk_downtime_start.stdout }}"
      end_time: "{{ checkmk_downtime_end.stdout }}"
      comment: "Site update in progress"
      downtime_type: "host"
      host_name: "{{ cmk_agent_host_name }}"
  no_log: true
  when: server_site_version.stdout != cmk_version+"."+cmk_edition and not site_just_installed.changed and (cmk_user | default('') | trim) != '' and (cmk_secret | default('') | trim) != ''
  ignore_errors: yes
  delegate_to: localhost
  register: downtime_result

# no_log hides the answer of the failed request above; the status and the
# reason of Checkmk carry no credentials, so the run says why
- name: "Downtime not set, the update goes on"
  ansible.builtin.debug:
    msg: >-
      Checkmk did not set the downtime of {{ cmk_agent_host_name }} on
      {{ cmk_main_server_full }}: HTTP {{ downtime_result.status | default('no answer') }}
      {{ (downtime_result.json | default({})).get('title', '') }}
      {{ (downtime_result.json | default({})).get('detail', '') }}
      {{ '' if downtime_result.json is defined else (downtime_result.msg | default('') | truncate(300)) }}
  when: downtime_result is failed

# The update of the Checkmk Ansible collection, for every version: -f
# confirms version and edition, --conflict=install takes the new files
# and skips the pre-flight check of 2.5. omd prints "Finished update"
# only when the update went through.
- name: "Update Sites to {{ cmk_version }}.{{ cmk_edition }}"
  become: True
  ansible.builtin.shell: |
    omd stop {{ cmk_site }}
    omd -f -V {{ cmk_version }}.{{ cmk_edition }} update --conflict=install {{ cmk_site }}
    omd start {{ cmk_site }}
  args:
    executable: /bin/bash
  register: site_update
  changed_when: "'Finished update' in site_update.stdout"
  failed_when: false
  when: server_site_version.stdout != cmk_version+"."+cmk_edition and not site_just_installed.changed

- name: "Site update of {{ cmk_site }} failed"
  ansible.builtin.fail:
    msg: >-
      omd update of {{ cmk_site }} to {{ cmk_version }}.{{ cmk_edition }} did not finish:
      {{ ((site_update.stdout_lines | default([])) + (site_update.stderr_lines | default([])))[-5:] | join(' / ') }}
  when: site_update is not skipped and site_update is not changed
