---
# Install the Checkmk version of the settings on the server, create the
# site when it is missing, otherwise update it to that version.

- name: "Set the target version and the local staging directory"
  ansible.builtin.set_fact:
    cmk_target: "{{ cmk_version }}.{{ cmk_edition }}"
    # The installer is staged on the controller, /tmp unless the settings
    # name another directory (private /tmp, no permission there)
    cmk_local_staging: "{{ installation_staging_path | default('/tmp', true) }}"

- name: "Ensure the local staging directory exists"
  ansible.builtin.file:
    path: "{{ cmk_local_staging }}"
    state: directory
  delegate_to: localhost

- name: "Check if we have the Installation File local"
  ansible.builtin.stat:
    path: "{{ cmk_local_staging }}/{{ cmk_version_filename }}"
  register: installation_file
  delegate_to: localhost

# User, working directory and /tmp of the controller differ between a pip
# installation, the container and a run from the web interface
- name: "Show where the Installation File is looked for"
  ansible.builtin.debug:
    msg: >-
      {{ 'Found' if installation_file.stat.exists else 'Not found, downloading to' }}
      {{ (cmk_local_staging ~ '/' ~ cmk_version_filename) | realpath }}
      on the Ansible controller {{ lookup('pipe', 'hostname') }}

- name: "Download Installation File from Checkmk Server"
  ansible.builtin.uri:
    url: "https://download.checkmk.com/checkmk/{{ cmk_version }}/{{ cmk_version_filename }}"
    dest: "{{ cmk_local_staging }}/{{ cmk_version_filename }}"
    method: GET
    user: "{{ subscription_username }}"
    password: "{{ subscription_password }}"
    force_basic_auth: true
  # The download proxy of the settings, else the proxy of the controller
  environment: "{{ {'https_proxy': download_proxy, 'http_proxy': download_proxy} if (download_proxy | default('') | trim) else {} }}"
  when: not installation_file.stat.exists
  delegate_to: localhost
  register: installer_download
  until: installer_download is not failed
  retries: 3
  delay: 10

# Exact match on version and edition: 2.5.0p1 must not match 2.5.0p19
- name: "Check if Version is already installed on the Servers"
  ansible.builtin.command:
    argv: [omd, versions, --bare]
  register: checkmk_version_installed
  changed_when: false
  failed_when: false

- name: "Remember if the Version is installed"
  ansible.builtin.set_fact:
    cmk_version_missing: "{{ cmk_target not in (checkmk_version_installed.stdout_lines | default([])) }}"

- name: "Copy Installation File to Servers"
  ansible.builtin.copy:
    src: "{{ cmk_local_staging }}/{{ cmk_version_filename }}"
    dest: "/tmp/{{ cmk_version_filename }}"
  when: cmk_version_missing | bool

- ansible.builtin.include_tasks: "{{ ansible_os_family }}-tasks.yml"

- name: "Remove the Installation File from the Server"
  ansible.builtin.file:
    path: "/tmp/{{ cmk_version_filename }}"
    state: absent

# By the site directory: the "no such site" message of omd differs
# between Checkmk versions
- name: "Check if the Site exists"
  become: true
  ansible.builtin.stat:
    path: "/omd/sites/{{ cmk_site }}"
  register: site_dir

- name: "Create the Site {{ cmk_site }}"
  become: true
  ansible.builtin.shell: |
    set -e
    omd -V {{ cmk_target | quote }} create {{ ('--admin-password ' ~ (inital_password | quote)) if inital_password else '' }} {{ cmk_site | quote }}
    omd start {{ cmk_site | quote }}
  args:
    executable: /bin/bash
  when: not site_dir.stat.exists

- name: "Check the Site version"
  become: true
  ansible.builtin.command:
    argv: [omd, version, --bare, "{{ cmk_site }}"]
  register: site_version_before
  changed_when: false
  when: site_dir.stat.exists

- name: "Update the Site {{ cmk_site }} to {{ cmk_target }}"
  when:
    - site_dir.stat.exists
    - (site_version_before.stdout | default('') | trim) != cmk_target
  block:
    # A VM snapshot for example; a failed call stops this server here,
    # before the downtime
    - name: "Call before the site update"
      ansible.builtin.include_tasks: pre_update_call.yml
      when: (cmk_pre_update_url | default('') | trim) != ''

    # Computed by Ansible: the date of the container image (BusyBox)
    # knows neither --date '+2 hours' nor %:z
    - name: "Calculate the downtime window of {{ cmk_downtime_range }} hours"
      ansible.builtin.set_fact:
        checkmk_downtime_start: "{{ '%Y-%m-%dT%H:%M:%S+00:00' | strftime(now().timestamp(), utc=True) }}"
        checkmk_downtime_end: "{{ '%Y-%m-%dT%H:%M:%S+00:00' | strftime(now().timestamp() + (cmk_downtime_range | float) * 3600, utc=True) }}"

    - name: "Set host to downtime before site update"
      ansible.builtin.uri:
        url: "{{ cmk_main_server_full }}/check_mk/api/1.0/domain-types/downtime/collections/host"
        method: POST
        # Checkmk answers a created downtime with 204 No Content
        status_code: [200, 204]
        validate_certs: false
        url_username: "{{ cmk_user }}"
        url_password: "{{ cmk_secret }}"
        force_basic_auth: true
        headers:
          Accept: "application/json"
          Content-Type: "application/json"
        body_format: json
        body:
          start_time: "{{ checkmk_downtime_start }}"
          end_time: "{{ checkmk_downtime_end }}"
          comment: "Site update in progress"
          downtime_type: "host"
          host_name: "{{ cmk_agent_host_name }}"
      no_log: true
      when:
        - (cmk_user | default('') | trim) != ''
        - (cmk_secret | default('') | trim) != ''
      ignore_errors: true
      delegate_to: localhost
      register: downtime_result

    # no_log hides the answer; status and reason carry no credentials
    - name: "Downtime not set, the update goes on"
      ansible.builtin.debug:
        msg: >-
          Checkmk did not set the downtime of {{ cmk_agent_host_name }} on
          {{ cmk_main_server_full }}: HTTP {{ downtime_result.status | default('no answer') }}
          {{ (downtime_result.json | default({})).get('title', '') }}
          {{ (downtime_result.json | default({})).get('detail', '') }}
          {{ '' if downtime_result.json is defined else (downtime_result.msg | default('') | truncate(300)) }}
      when: downtime_result is failed

    # The update of the Checkmk Ansible collection, for every version: -f
    # confirms version and edition, --conflict=install takes the new files
    # and skips the pre-flight check of 2.5. omd prints "Finished update"
    # only when the update went through.
    - name: "Run omd update on {{ cmk_site }}"
      become: true
      ansible.builtin.shell: |
        omd stop {{ cmk_site | quote }}
        omd -f -V {{ cmk_target | quote }} update --conflict=install {{ cmk_site | quote }}
        omd start {{ cmk_site | quote }}
      args:
        executable: /bin/bash
      register: site_update
      changed_when: "'Finished update' in site_update.stdout"
      failed_when: false

    - name: "Fail when the update of {{ cmk_site }} did not finish"
      ansible.builtin.fail:
        msg: >-
          omd update of {{ cmk_site }} to {{ cmk_target }} did not finish:
          {{ ((site_update.stdout_lines | default([])) + (site_update.stderr_lines | default([])))[-5:] | join(' / ') }}
      when: site_update is not changed

    - name: "Bake agents after the site update"
      ansible.builtin.include_tasks: bake_agents.yml
      when: cmk_bake_agents | default(false) | bool
