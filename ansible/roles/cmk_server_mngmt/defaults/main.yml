---
# Host name of this server in Checkmk, used for the downtime during the
# site update. Override it per host with an Ansible custom variable when
# the Checkmk host name differs from the inventory name.
cmk_agent_host_name: "{{ inventory_hostname }}"

# Set by the syncer for the central site with "Bake Agents after the
# Update": the agents are baked after its update.
cmk_bake_agents: false
