---
# This Playbook is suplied with information by the cmdb_syncer
# See Docu there about how to use

- hosts: all
  gather_facts: false
  # Temp files on the server in /tmp, not in the home of the login user,
  # also when the playbook runs on the command line (file integrity checks
  # like AIDE watch the home)
  vars:
    ansible_remote_tmp: /tmp
  tasks:
  #  - name: Check SSH Access
  #    command: echo "Access working"
  #    become: true
  #    run_once: true
  #    tags:
  #      - always

    - name: "Cleanup old CMK Installations"
      become: True
      ansible.builtin.shell: |
        omd cleanup
      args:
        executable: /bin/bash
